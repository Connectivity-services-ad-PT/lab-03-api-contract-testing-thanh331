name: Contract and Newman Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI contracts
        run: npm run lint:contracts

      - name: Run Mock Servers and Newman Tests
        run: |
          npx @stoplight/prism-cli mock contracts/analytics.openapi.yaml -p 4010 > prism1.log 2>&1 &
          npx @stoplight/prism-cli mock contracts/iot-ingestion.openapi.yaml -p 4011 > prism2.log 2>&1 &
          npx wait-on http-get://localhost:4010/health http-get://localhost:4011/health --timeout 30000
          npm run test:mock

      - name: Show Prism logs on failure
        if: failure()
        run: |
          cat prism1.log || true
          cat prism2.log || true

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/