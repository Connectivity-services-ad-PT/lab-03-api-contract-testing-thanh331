name: Contract and Newman Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI contracts
        run: npm run lint:contracts

      - name: Start Prism mock servers
        run: |
          nohup npm run mock:analytics > prism1.log 2>&1 &
          nohup npm run mock:iot_dependency > prism2.log 2>&1 &

      - name: Wait for mock servers
        run: npx wait-on http://localhost:4010/health http://localhost:4011/health --timeout 30000

      - name: Run Newman contract tests
        run: npm run test:mock

      - name: Show Prism logs on failure
        if: failure()
        run: |
          cat prism1.log || true
          cat prism2.log || true

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/